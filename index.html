<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071018" />
  <title>SW Analytics - Live Call Operations Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #071018;
      --bg-2: #0c1824;
      --panel: rgba(14, 28, 42, 0.78);
      --panel-solid: #102232;
      --line: rgba(148, 187, 214, 0.16);
      --text: #e8f2f8;
      --muted: #8aa3b5;
      --teal: #4ee0c2;
      --teal-2: #1aa88e;
      --gold: #f5c451;
      --ok: #5ee4a8;
      --warn: #ffc56e;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --nav-h: 68px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    button, input, select { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    header.appbar {
      height: var(--nav-h);
      min-height: var(--nav-h);
      z-index: 20;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(7, 16, 24, 0.92);
      border-bottom: 1px solid var(--line);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, var(--teal), #0d6b5d);
      color: #04231d;
      font-weight: 700;
      box-shadow: 0 0 0 4px rgba(78, 224, 194, 0.12);
      flex-shrink: 0;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .brand-text p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav.tabs {
      display: flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(16, 34, 50, 0.7);
    }

    nav.tabs a {
      padding: 8px 18px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    nav.tabs a:hover {
      color: var(--text);
    }

    nav.tabs a.active {
      color: #04231d;
      background: var(--teal);
      box-shadow: 0 2px 8px rgba(78, 224, 194, 0.3);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #04231d;
      animation: pulse 1.6s infinite ease-in-out;
    }

    nav.tabs a:not(.active) .live-dot {
      background: var(--ok);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.7); opacity: 0.5; }
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: rgba(16, 34, 50, 0.6);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .btn-action:hover {
      color: var(--teal);
      border-color: var(--teal);
      background: rgba(78, 224, 194, 0.1);
    }

    .btn-action svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .viewport {
      flex: 1;
      position: relative;
      background: var(--bg);
      overflow: hidden;
    }

    .frame-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
    }

    iframe#dashboard-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
    }

    iframe#dashboard-frame.loaded {
      opacity: 1;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(78, 224, 194, 0.15);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    @media (max-width: 768px) {
      header.appbar {
        height: auto;
        min-height: auto;
        padding: 12px 14px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .brand { flex: 1; }
      .nav-center { order: 3; width: 100%; }
      nav.tabs { width: 100%; }
      nav.tabs a { flex: 1; justify-content: center; padding: 8px 12px; }
      .nav-actions { order: 2; }
      .btn-text { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="brand">
        <div class="logo">SW</div>
        <div class="brand-text">
          <h1>SW Analytics</h1>
          <p>Call operations leaderboard</p>
        </div>
      </div>

      <div class="nav-center">
        <nav class="tabs">
          <a href="#/" id="tab-live" class="active">
            <span class="live-dot"></span>
            <span>Daily realtime</span>
          </a>
          <a href="#/analytics" id="tab-hist">
            <span>Historical</span>
          </a>
        </nav>
      </div>

      <div class="nav-actions">
        <button id="btn-refresh" class="btn-action" title="Refresh live feed">
          <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          <span class="btn-text">Refresh</span>
        </button>
        <a id="btn-s3" class="btn-action" href="https://dat-tools.s3.amazonaws.com/swlogs/realtime_SF.html" target="_blank" rel="noopener" title="Open direct in S3">
          <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
          <span class="btn-text">Open S3 ↗</span>
        </a>
      </div>
    </header>

    <main class="viewport">
      <div id="loader" class="loader">
        <div class="spinner"></div>
        <span id="loader-text">Connecting to live S3 stream…</span>
      </div>
      <div class="frame-wrapper">
        <iframe
          id="dashboard-frame"
          title="SW Analytics Dashboard"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
          loading="eager"
        ></iframe>
      </div>
    </main>
  </div>

  <script>
    const S3_ENDPOINTS = {
      live: {
        url: "https://dat-tools.s3.amazonaws.com/swlogs/realtime_SF.html",
        title: "Daily realtime - SW Analytics"
      },
      hist: {
        url: "https://dat-tools.s3.amazonaws.com/swlogs/historical.html",
        title: "Historical Analytics - SW Analytics"
      }
    };

    const frame = document.getElementById("dashboard-frame");
    const loader = document.getElementById("loader");
    const loaderText = document.getElementById("loader-text");
    const tabLive = document.getElementById("tab-live");
    const tabHist = document.getElementById("tab-hist");
    const btnS3 = document.getElementById("btn-s3");
    const btnRefresh = document.getElementById("btn-refresh");

    function getActiveTab() {
      const hash = location.hash.replace(/^#\/?/, "");
      return hash === "analytics" || hash === "historical" ? "hist" : "live";
    }

    function updateNavigation() {
      const active = getActiveTab();
      const endpoint = S3_ENDPOINTS[active];

      tabLive.classList.toggle("active", active === "live");
      tabHist.classList.toggle("active", active === "hist");
      document.title = endpoint.title;
      btnS3.href = endpoint.url;

      // Load into iframe with cache buster for instant updates
      loadIframe(endpoint.url);
    }

    function loadIframe(url) {
      loader.classList.remove("hidden");
      loaderText.textContent = "Loading live data from S3…";
      frame.classList.remove("loaded");

      // Add timestamp to bust browser cache
      const bustUrl = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
      frame.src = bustUrl;
    }

    frame.addEventListener("load", () => {
      loader.classList.add("hidden");
      frame.classList.add("loaded");
    });

    btnRefresh.addEventListener("click", () => {
      const active = getActiveTab();
      loadIframe(S3_ENDPOINTS[active].url);
    });

    window.addEventListener("hashchange", updateNavigation);
    updateNavigation();
  </script>
</body>
</html>
